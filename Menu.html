<style>
  body {
    margin: 0;
    background-image: url('fondo9.jpeg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #050510;
    font-family: "Wide Latin", Arial, sans-serif;
  }

  /* Fondo oscuro transparente para que se lea el neón y se vea tu foto */
  .fondo-neon {
    background: rgba(0, 0, 0, 0.55);
    min-height: 100vh;
    padding-top: 20px;
    padding-bottom: 30px;
  }

  /* TITULO MENU */
  h1 {
    font-size: 55px;
    color: #00FFFF;
    text-shadow: 0 0 5px #00FFFF, 0 0 15px #00FFFF, 0 0 30px #00FFFF, 0 0 50px #00FFFF;
    margin: 10px;
    letter-spacing: 5px;
  }

  /* BOTONES DEL MENU */
  h2 {
    margin: 12px;
  }

  h2 a {
    text-decoration: none;
    font-size: 24px;
    padding: 8px 25px;
    border: 2px solid currentColor;
    border-radius: 15px;
    background: rgba(0,0,0,0.5);
    display: inline-block;
    transition: 0.2s;
  }

  /* Colores neón diferentes para cada uno */
  h2:nth-of-type(1) a { color: #00FFFF; text-shadow: 0 0 5px #00FFFF, 0 0 15px #00FFFF; box-shadow: 0 0 10px #00FFFF, inset 0 0 10px #00FFFF; }
  h2:nth-of-type(2) a { color: #FF00FF; text-shadow: 0 0 5px #FF00FF, 0 0 15px #FF00FF; box-shadow: 0 0 10px #FF00FF, inset 0 0 10px #FF00FF; }
  h2:nth-of-type(3) a { color: #39FF14; text-shadow: 0 0 5px #39FF14, 0 0 15px #39FF14; box-shadow: 0 0 10px #39FF14, inset 0 0 10px #39FF14; }
  h2:nth-of-type(4) a { color: #FFFF00; text-shadow: 0 0 5px #FFFF00, 0 0 15px #FFFF00; box-shadow: 0 0 10px #FFFF00, inset 0 0 10px #FFFF00; }
  h2:nth-of-type(5) a { color: #FF00AA; text-shadow: 0 0 5px #FF00AA, 0 0 15px #FF00AA; box-shadow: 0 0 10px #FF00AA, inset 0 0 10px #FF00AA; }
  h2:nth-of-type(6) a { color: #00FFAA; text-shadow: 0 0 5px #00FFAA, 0 0 15px #00FFAA; box-shadow: 0 0 10px #00FFAA, inset 0 0 10px #00FFAA; }
  h2:nth-of-type(7) a { color: #FF6600; text-shadow: 0 0 5px #FF6600, 0 0 15px #FF6600; box-shadow: 0 0 10px #FF6600, inset 0 0 10px #FF6600; }
  h2:nth-of-type(8) a { color: #AA00FF; text-shadow: 0 0 5px #AA00FF, 0 0 15px #AA00FF; box-shadow: 0 0 10px #AA00FF, inset 0 0 10px #AA00FF; }
  h2:nth-of-type(9) a { color: #00FFFF; text-shadow: 0 0 5px #00FFFF, 0 0 15px #00FFFF; box-shadow: 0 0 10px #00FFFF, inset 0 0 10px #00FFFF; }

  /* Cuando pasas el mouse, brilla más */
  h2 a:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, inset 0 0 20px currentColor;
  }
</style>
